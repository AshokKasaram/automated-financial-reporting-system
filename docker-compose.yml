x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: Dockerfile.airflow
  env_file:
    - .env
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: 'ZmDfcTF7_60GrrY167zsiPd67pEvs0aGOv2oasOM1Pg='
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'false'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: 'true'
    PYTHONPATH: /opt/airflow
    # --- Business data source (MySQL) ---
    DATABASE_URL: "mysql+pymysql://reporter:reporter_pw@mysql:3306/financial_reporter"
    SMTP_HOST: smtp.gmail.com
    SMTP_PORT: "587"
    # SMTP_FROM, SMTP_USER, SMTP_PASS, REPORT_RECIPIENTS come from .env (gitignored)
  volumes:
    - ./dags:/opt/airflow/dags
    - ./src:/opt/airflow/src
    - ./output:/opt/airflow/output
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
  depends_on:
    postgres:
      condition: service_healthy
    mysql:
      condition: service_healthy

services:
  # Airflow's own metadata DB (internal bookkeeping — leave as is)
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Real business data — the ledger table our pipeline reports on
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpw
      MYSQL_DATABASE: financial_reporter
      MYSQL_USER: reporter
      MYSQL_PASSWORD: reporter_pw
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpw"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - mysql_data:/var/lib/mysql

  # One-shot job: creates table + seeds sample rows, then exits
  mysql-seed:
    build:
      context: .
      dockerfile: Dockerfile.seed
    environment:
      DATABASE_URL: "mysql+pymysql://reporter:reporter_pw@mysql:3306/financial_reporter"
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"

  airflow-init:
    <<: *airflow-common
    user: "0:0"
    command: bash -c "mkdir -p /opt/airflow/logs/scheduler && chmod -R 777 /opt/airflow/logs && airflow db init && airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com"
    restart: on-failure

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    ports:
      - "8501:8501"
    environment:
      DATABASE_URL: "mysql+pymysql://reporter:reporter_pw@mysql:3306/financial_reporter"
    volumes:
      - ./output:/app/output
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  postgres_data:
  mysql_data:
